# Phase-1 go/no-go, GOLD arm (control): policy optimizes exact-match +/-1.

model: Qwen/Qwen2.5-0.5B-Instruct
dataset: openai/gsm8k
split: train

# GRPO core
num_generations: 8        # group size G - FIXED across every arm and seed
temperature: 1.0
top_p: 0.95

# Training
learning_rate: 5.0e-6
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
max_steps: 500
max_prompt_length: 256
max_completion_length: 512
save_steps: 100
seed: 42

# KL penalty - see proxy_rl_05b.yaml, 0.04 does not bind at this regime.
beta: 0.04

# Logging
logging_steps: 10
